#!/usr/sbin/nft -f
# Made-up ruleset in the shape of the router's: WAN eth0, LAN eth1, guest eth2.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto ipv6-icmp accept
        meta l4proto icmp accept
        iifname { "eth1", "eth2" } udp dport { 53, 67 } accept
        iifname { "eth1", "eth2" } tcp dport 53 accept
        iifname "eth1" tcp dport { 22, 4000 } accept
        iifname "eth0" udp dport 546 accept   # DHCPv6 prefix delegation
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        meta l4proto ipv6-icmp accept
        iifname "eth1" oifname "eth0" accept
        iifname "eth2" oifname "eth0" accept
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth0" masquerade
    }
}
