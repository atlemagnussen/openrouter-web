{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "eth1",
        "eth2"
      ],
      "service-sockets-max-retries": 12,
      "service-sockets-retry-wait-time": 5000
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "lfc-interval": 3600
    },
    "valid-lifetime": 600,
    "max-valid-lifetime": 7200,
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "interface": "eth1",
        "user-context": {
          "name": "LAN"
        },
        "pools": [
          {
            "pool": "192.168.1.101 - 192.168.1.250"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "192.168.1.1"
          },
          {
            "name": "domain-name-servers",
            "data": "192.168.1.1"
          }
        ],
        "reservations": [
          {
            "hostname": "nas",
            "hw-address": "02:00:00:00:01:03",
            "ip-address": "192.168.1.3"
          },
          {
            "hostname": "desktop",
            "hw-address": "02:00:00:00:01:10",
            "ip-address": "192.168.1.10"
          },
          {
            "hostname": "laptop-wifi",
            "hw-address": "02:00:00:00:01:11",
            "ip-address": "192.168.1.11"
          },
          {
            "hostname": "printer",
            "hw-address": "02:00:00:00:01:20",
            "ip-address": "192.168.1.20"
          },
          {
            "hostname": "k8s-master-01",
            "hw-address": "02:00:00:00:01:30",
            "ip-address": "192.168.1.30"
          }
        ]
      },
      {
        "id": 2,
        "subnet": "192.168.2.0/24",
        "interface": "eth2",
        "user-context": {
          "name": "LAN-GUEST"
        },
        "pools": [
          {
            "pool": "192.168.2.101 - 192.168.2.250"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "192.168.2.1"
          },
          {
            "name": "domain-name-servers",
            "data": "192.168.2.1"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "severity": "INFO",
        "output-options": [
          {
            "output": "stdout"
          }
        ]
      }
    ]
  }
}
