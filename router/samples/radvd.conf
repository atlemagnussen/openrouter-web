# LAN interface
interface eth1
{
    AdvSendAdvert on;
    MinRtrAdvInterval 3;
    MaxRtrAdvInterval 10;

    # Delegated by the ISP
    prefix 2001:db8:1234:e701::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
        AdvValidLifetime 3600;
        AdvPreferredLifetime 3600;
    };
    # ULA
    prefix fd00:1234:5678:9abc::/64 {
        AdvOnLink on;
        AdvAutonomous on;
    };
    RDNSS fd00:1234:5678:9abc::1
    {
    };
};
